services:
  sim:
    build: ./sim
    environment:
      SEED: ${SEED:-42}
      NUM_ROVERS: ${NUM_ROVERS:-3}
      SIM_SPEED: ${SIM_SPEED:-3.0}
      MAP_SIZE: ${MAP_SIZE:-80}
      GRAVITY_G: ${GRAVITY_G:-2.0}
      AUTO_RESET_S: ${AUTO_RESET_S:-60}
    # No host port on purpose: the web container reaches the sim over the compose network, so
    # nothing clashes with other apps on port 8000. To call the sim API directly from your
    # machine, uncomment these two lines (pick any free host port).
    # ports:
    #   - "8765:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      sim:
        condition: service_healthy
    restart: unless-stopped
