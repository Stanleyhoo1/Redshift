services:
  sim:
    build: ./sim
    environment:
      SEED: ${SEED:-42}
      NUM_ROVERS: ${NUM_ROVERS:-3}
      SIM_SPEED: ${SIM_SPEED:-3.0}
      MAP_SIZE: ${MAP_SIZE:-120}
      GRAVITY_G: ${GRAVITY_G:-2.0}
      AUTO_RESET_S: ${AUTO_RESET_S:-0}
      AUTO_LAUNCH: ${AUTO_LAUNCH:-0}
      MESAS: ${MESAS:-1}
      CANYON: ${CANYON:-1}
      DUNES: ${DUNES:-1}
      BOULDER_FIELDS: ${BOULDER_FIELDS:-1}
      PITS: ${PITS:-1}
      GEYSERS: ${GEYSERS:-1}
      ICE_SHEETS: ${ICE_SHEETS:-1}
      GROUND_DETAIL: ${GROUND_DETAIL:-1}
      FLORA: ${FLORA:-1}
      WEAR: ${WEAR:-normal}
      GEMMA_ENABLED: ${GEMMA_ENABLED:-1}
      GEMMA_URL: ${GEMMA_URL:-http://host.docker.internal:11434}
      GEMMA_MODEL: ${GEMMA_MODEL:-gemma4:e2b}
      GEMMA_FAKE: ${GEMMA_FAKE:-0}
      OPERATOR_TIMEOUT_S: ${OPERATOR_TIMEOUT_S:-0}
      CAMERA_SHADOWS: ${CAMERA_SHADOWS:-1}
    # Lets the container reach Ollama running on your machine (Docker Desktop and plain Docker on Linux/WSL).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No host port on purpose: the web container reaches the sim over the compose network, so
    # nothing clashes with other apps on port 8000. To call the sim API directly from your
    # machine, uncomment these two lines (pick any free host port).
    # ports:
    #   - "8765:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      sim:
        condition: service_healthy
    restart: unless-stopped
